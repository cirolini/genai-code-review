name: "ChatGPT GitHub Actions"
description: "This GitHub Action automates code review for pull requests using OpenAI's GPT models. By integrating this action into your CI/CD pipeline, it provides detailed, AI-generated reviews of your code directly within the PR comments. This tool helps maintain code quality, ensures adherence to best practices, and highlights potential improvements and bugs."
inputs:
  provider:
    description: "LLM provider: openai, anthropic, gemini, or openai-compatible."
    required: false
    default: "openai"
  model:
    description: "Model ID. Defaults to a cost-conscious model for the chosen provider."
    required: false
    default: ""
  api_key:
    description: "API key for the chosen provider. Falls back to openai_api_key."
    required: false
    default: ""
  base_url:
    description: "Base URL for an OpenAI-compatible server (Ollama, vLLM, Azure OpenAI, OpenRouter). Required when provider is openai-compatible."
    required: false
    default: ""
  temperature:
    description: "Sampling temperature. Falls back to openai_temperature."
    required: false
    default: ""
  max_tokens:
    description: "Maximum tokens in the response. Falls back to openai_max_tokens."
    required: false
    default: ""
  openai_api_key:  # deprecated alias for api_key, kept for v2 workflows
    description: 'OpenAI API Key. Deprecated: use api_key.'
    required: false
    default: ''
  github_token:  # id of input
    description: 'Github API Key'
    required: true
    default: ''
  github_pr_id:  # id of input
    description: 'Github PR ID'
    required: true
    default: ''
  openai_model:
    description: "Deprecated: use model."
    required: false
    default: ""
  openai_temperature:
    description: "Deprecated: use temperature."
    required: false
    default: ""
  openai_max_tokens:
    description: "Deprecated: use max_tokens."
    required: false
    default: ""
  mode:
    description: "How to review. 'review' (default) posts inline comments on the diff. 'files' and 'patch' keep the v2 single-comment behaviour."
    required: false
    default: "review"
  language:
    description: "The language for the code review"
    required: false
    default: "en"  # English as the default language
  max_comments:
    description: "Maximum inline comments to post per review. Findings beyond this are counted and listed in the summary, not discarded. Default 5."
    required: false
    default: ""
  min_severity:
    description: "Lowest severity worth posting: blocker, major, minor, nit. Default nit."
    required: false
    default: ""
  min_confidence:
    description: "Lowest confidence worth posting, 0 to 1. Default 0."
    required: false
    default: ""
  ignore_paths:
    description: "Newline- or comma-separated globs to skip. Unset uses sensible defaults (lockfiles, generated and vendored code, snapshots, minified assets). Set to a single space to disable."
    required: false
  incremental:
    description: "On a new push, review only the commits since the last review. Default true."
    required: false
    default: ""
  panel:
    description: "Experimental. Comma-separated providers to run as a panel, e.g. 'openai,anthropic'. Findings both report rank higher; findings only one reports are demoted. Roughly doubles cost."
    required: false
    default: ""
  config_path:
    description: "Repository config file. Action inputs take precedence over it. Default .genai-review.yml."
    required: false
    default: ""
  runlog_path:
    description: "Where to write the per-run JSON log. Upload it with actions/upload-artifact to keep a record of cost and coverage over time."
    required: false
    default: "genai-review-runlog.json"
  custom_prompt:
    description: "Custom prompt to use for generating responses. If not provided, a default prompt will be used based on the mode."
    required: false
    default: ""
runs:
  using: "docker"
  image: "Dockerfile"
  env:
    PROVIDER: ${{ inputs.provider }}
    MODEL: ${{ inputs.model }}
    API_KEY: ${{ inputs.api_key }}
    BASE_URL: ${{ inputs.base_url }}
    TEMPERATURE: ${{ inputs.temperature }}
    MAX_TOKENS: ${{ inputs.max_tokens }}
    OPENAI_API_KEY: ${{ inputs.openai_api_key }}
    GITHUB_TOKEN: ${{ inputs.github_token }}
    GITHUB_PR_ID: ${{ inputs.github_pr_id }}
    OPENAI_MODEL: ${{ inputs.openai_model }}
    OPENAI_TEMPERATURE: ${{ inputs.openai_temperature }}
    OPENAI_MAX_TOKENS: ${{ inputs.openai_max_tokens }}
    MODE: ${{ inputs.mode }}
    MAX_COMMENTS: ${{ inputs.max_comments }}
    MIN_SEVERITY: ${{ inputs.min_severity }}
    MIN_CONFIDENCE: ${{ inputs.min_confidence }}
    IGNORE_PATHS: ${{ inputs.ignore_paths }}
    INCREMENTAL: ${{ inputs.incremental }}
    PANEL: ${{ inputs.panel }}
    RUNLOG_PATH: ${{ inputs.runlog_path }}
    CONFIG_PATH: ${{ inputs.config_path }}
    LANGUAGE: ${{ inputs.language }} 
    CUSTOM_PROMPT: ${{ inputs.custom_prompt }} 
