name: GenAI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  genai_code_review:
    runs-on: ubuntu-latest
    name: GenAI Code Review
    steps:
      # No actions/checkout step on purpose.
      #
      # This action is a container action that reads the pull request over the
      # GitHub API, so it never needs the repository on disk. Checking the
      # repository out here also used to hide a bug: the container runs with
      # --workdir /github/workspace, so a checkout that happened to contain
      # src/main.py made the old relative CMD work in this repository while it
      # failed everywhere else (issue #47). Without the checkout, this job
      # exercises the same code path an external user gets.
      # Pinned to v3, which is what this repository ships. It was pinned to v2
      # while asking for `mode: review`, an input v2 does not have, so every
      # run since the v3 work began died with "Invalid mode. Choose either
      # 'files' or 'patch'." A repository whose own review bot cannot start is
      # not a demonstration of anything.
      #
      # The provider is OpenAI because OPENAI_API_KEY is the secret this
      # repository has. Gemini is the default in v3 and the configuration with
      # measured numbers behind it (docs/results/); moving this workflow to it
      # needs a GEMINI_API_KEY secret added here first.
      - name: GenAI Code Review
        uses: cirolini/genai-code-review@v3
        with:
          provider: openai
          api_key: ${{ secrets.OPENAI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_pr_id: ${{ github.event.pull_request.number }}
          mode: review

      # Keeps a record of cost, coverage and what was suppressed, so claims
      # about the tool can be checked rather than asserted.
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genai-review-runlog
          path: genai-review-runlog.json
          if-no-files-found: ignore
